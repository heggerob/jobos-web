<html lang="nb">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontor | JobOS</title>
<meta name="description" content="JobOS Kontor – ordre, planlegging, timegodkjenning, kjørebok, tilbud, varekatalog, innkjøp og skjema i nettleseren.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1B2B">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<body class="office gated">
<a class="skip-link" href="#main">Hopp til innhold</a>
<header class="app-header">
  <div class="app-header-inner">
    <a class="brand" href="index.html" aria-label="JobOS – til forsiden"><img src="assets/logo.svg" alt="JobOS" width="120" height="32"></a>
    <span class="app-label">Kontor</span>
    <div class="app-company" id="company-slot"></div>
    <div class="user-menu" id="user-menu-wrap" hidden>
      <button type="button" class="user-btn" id="user-btn" aria-expanded="false" aria-controls="user-menu" aria-haspopup="true">
        <span class="avatar" id="user-avatar" aria-hidden="true">?</span><span class="user-name" id="user-name">Bruker</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="user-dropdown" id="user-menu" hidden>
        <p class="user-email" id="user-email"></p>
        <button type="button" data-action="switch-company" id="menu-switch" hidden>Bytt firma</button>
        <button type="button" data-action="reload">Hent data på nytt</button>
        <button type="button" data-action="reset-demo" id="menu-reset" hidden>Tilbakestill demodata</button>
        <a href="index.html">Til jobos.no</a>
        <button type="button" data-action="logout" id="menu-logout">Logg ut</button>
      </div>
    </div>
  </div>
</header>
<div class="demo-banner" id="demo-banner" role="note" hidden>
  <strong>Demo</strong> – data lagres bare i nettleseren. <button type="button" class="linkish" data-action="reset-demo">Tilbakestill</button>
</div>

  <main id="main" class="app-main" tabindex="-1">
    <div id="view" aria-live="polite"><p class="loading">Laster kontorsiden …</p></div>
    <noscript><div class="notice err">Kontorsiden krever JavaScript.</div></noscript>
  </main>
</div>

<dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <h2 id="drawer-title">Detaljer</h2>
    <button type="button" class="icon-btn" data-close aria-label="Lukk panel"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</dialog>

<dialog class="modal" id="modal" aria-labelledby="modal-title">
  <form method="dialog" class="modal-form" id="modal-form" novalidate>
    <div class="drawer-head">
      <h2 id="modal-title">Skjema</h2>
      <button type="button" class="icon-btn" data-close aria-label="Lukk"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <p class="notice err" id="modal-error" role="alert" hidden></p>
    <div class="modal-actions" id="modal-actions"></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/firebase-config.js"></script>
<script src="assets/firestore.js"></script>
<script src="assets/office.js"></script>
